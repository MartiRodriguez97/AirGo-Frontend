# WorkFlow

name: CI

on:
  push:
    branches: [ "main" , "develop" , "feature/*" , "hotfix/*" ]
  pull_request:
    branches: [ "main" , "develop" , "feature/*" , "hotfix/*" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # GOOGLE SERVICES JSON
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
    
      # Set up JDK para Android
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      # Setup Gradle
      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-includes: |
            caches
            notifications
          gradle-home-cache-cleanup: true

      # Permisos per Gradle
      - name: Atorgar permís execució per a Gradle
        run: chmod +x gradlew

      # Linting (Detekt i ktlint)
      - name: Run Detekt analysis
        run: ./gradlew :app:detekt --no-daemon --parallel --configuration-cache --build-cache --stacktrace

      - name: Run ktlint analysis
        run: ./gradlew :app:ktlintCheck

      # Run Tests
      - name: Run gradle tests
        run: ./gradlew test
      

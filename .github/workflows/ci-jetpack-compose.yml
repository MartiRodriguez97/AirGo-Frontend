# WorkFlow

name: CI

on:
  push:
    branches: [ "main" , "develop" ]
  pull_request:
    branches: [ "main" , "develop" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Set up JDK para Android
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      # Setup Gradle
      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-includes: |
            caches
            notifications
          gradle-home-cache-cleanup: true

      # Permisos per Gradle
      - name: Atorgar permís execució per a Gradle
        run: chmod +x gradlew

      - name: Run Detekt analysis (fast mode)
        run: ./gradlew :app:detekt --no-daemon --parallel --configuration-cache --build-cache --stacktrace

      # Run Tests Build
      - name: Run gradle tests
        run: ./gradlew test
      
